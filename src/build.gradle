plugins {
    id 'java'
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0'
}

group 'com.icesi'
version '1.0.0'

repositories {
    mavenCentral()
    maven {
        url 'https://repo.zeroc.com/nexus/content/repositories/releases'
    }
}

dependencies {
    implementation 'com.zeroc:ice:3.7.10'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.postgresql:postgresql:42.6.0'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// ✅ CONFIGURACIÓN SLICE CON RUTAS RELATIVAS
slice {
    java {
        files = [file('../chatapp.ice')]  // ← Sube un nivel para encontrar chatapp.ice
        outputDir = file('generated')     // ← Ahora en src/generated
    }
}

// ✅ SourceSets ajustados
sourceSets {
    main {
        java {
            srcDirs = ['main/java', 'generated']  // ← Rutas relativas a src/
        }
    }
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// TAREAS CON RUTAS AJUSTADAS
task runServer(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.icesi.chatapp.Server.Server'
    workingDir file('..')  // ← Ejecutar desde la raíz
    dependsOn compileJava
}

task runClient(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.icesi.chatapp.Client.Client'
    workingDir file('..')  // ← Ejecutar desde la raíz
    dependsOn compileJava
}

// JARs con configuración ajustada
jar {
    archiveBaseName = 'chat-server'
    manifest {
        attributes 'Main-Class': 'com.icesi.chatapp.Server.Server'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task clientJar(type: Jar) {
    archiveBaseName = 'chat-client'
    manifest {
        attributes 'Main-Class': 'com.icesi.chatapp.Client.Client'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task buildJars(dependsOn: [jar, clientJar]) {
    group = 'build'
    description = 'Builds both server and client executable JARs.'
}