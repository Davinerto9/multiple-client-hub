plugins {
    id 'java'
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0' apply false
    id 'war'
}

apply plugin: 'com.zeroc.gradle.ice-builder.slice'

group = 'com.icesi'
version = '1.0.0'

slice {
    java {
        files = [file("Chat.ice")]
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.postgresql:postgresql:42.6.0'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
    implementation 'com.zeroc:ice:3.7.10'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

test {
    useJUnitPlatform()
}

// Server and client tasks
task runServer(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.icesi.chatapp.Server.Server'
    workingDir file('.')
}

task runClient(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.icesi.chatapp.Client.Client'
    workingDir file('.')
}

// JAR tasks
jar {
    archiveBaseName = 'chat-server'
    manifest {
        attributes 'Main-Class': 'com.icesi.chatapp.Server.Server'
    }
    from {
        sourceSets.main.output
        sourceSets.main.runtimeClasspath
                .filter { it.exists() }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task clientJar(type: Jar) {
    archiveBaseName = 'chat-client'
    manifest {
        attributes 'Main-Class': 'com.icesi.chatapp.Client.Client'
    }
    from {
        sourceSets.main.output
        sourceSets.main.runtimeClasspath
                .filter { it.exists() }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task buildJars(dependsOn: [jar, clientJar]) {
    group = 'build'
    description = 'Builds both server and client executable JARs.'
}

task buildFrontend(type: Exec) {
    workingDir 'web-client'
    commandLine 'cmd', '/c', 'npm', 'run', 'build' // en Windows
}

task runIceServer(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.icesi.chatapp.ICEServices.ICEServer'
}


war {
    dependsOn buildFrontend // primero corre webpack
    archiveBaseName = 'chat-frontend' // nombre del .war
    from('web-client/dist') {
        into '' // raíz del WAR: index.html, bundle.js, extLibs/...
    }
    webInf { // opcional: WEB-INF mínimo
        from('src/main/webapp/WEB-INF') {
            include '**/*' // si quieres poner web.xml, etc.
        }
    }
}